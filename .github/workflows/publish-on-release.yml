name: Publish to winget on Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-winget:
    runs-on: windows-latest
    env:
      WINGETCREATE_VERSION: 1.12.8.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release asset URL
        id: release
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "keycloak-winget-publish"
          }
          $base = "https://api.github.com/repos/${{ github.repository }}/releases"

          try {
            $release = Invoke-RestMethod -Headers $headers -Uri "$base/tags/${{ github.event.release.tag_name }}"
          }
          catch {
            throw "Failed to get release for tag '${{ github.event.release.tag_name }}'."
          }

          $asset = $release.assets | Where-Object { $_.name -like "*Windows-x64.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "Asset not found for release '${{ github.event.release.tag_name }}'."
          }

          Write-Output "version=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          Write-Output "asset_url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          Write-Output "Found release asset: $($asset.browser_download_url)"

      - name: Install wingetcreate
        run: |
          $version = $env:WINGETCREATE_VERSION
          $downloadUrl = "https://github.com/microsoft/winget-create/releases/download/v${version}/wingetcreate.exe"
          Invoke-WebRequest -Uri $downloadUrl -OutFile "wingetcreate.exe"
          Write-Output "$(Get-Location)" | Add-Content $env:GITHUB_PATH

      - name: Update winget package
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $assetUrl = "${{ steps.release.outputs.asset_url }}"
          $version = "${{ steps.release.outputs.version }}"

          & wingetcreate.exe update --token ${{ secrets.GITHUB_TOKEN }} `
            --urls $assetUrl `
            --version $version `
            $cfg.packageId
