name: Build winget

on:
  workflow_dispatch:
    inputs:
      use_latest_tag:
        description: "Use latest upstream tag"
        default: true
        type: boolean
      tag_name:
        description: "Upstream version"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream version
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $useLatest = "${{ inputs.use_latest_tag }}" -eq "true" -or "${{ github.event_name }}" -eq "schedule"
          $version = "${{ inputs.tag_name }}".Trim().TrimStart('v')

          if ($useLatest) {
            $latest = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "winget-package" } -Uri "https://api.github.com/repos/$($cfg.upstreamRepo)/releases/latest"
            $version = $latest.tag_name.TrimStart('v')
          }
          elseif ([string]::IsNullOrWhiteSpace($version)) {
            throw "tag_name is required when use_latest_tag is false."
          }

          Write-Output "Upstream version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Skip if release already exists
        run: |
          gh release view $env:VERSION --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Release $env:VERSION already exists. Skipping."
            "SKIP=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          $global:LASTEXITCODE = 0

      - name: Build package
        if: env.SKIP != 'true'
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $assetName = $cfg.upstreamAsset.Replace('{version}', $env:VERSION)
          $rootName = $cfg.upstreamRoot.Replace('{version}', $env:VERSION)
          $entry = $cfg.entryScript.Replace('/', '\')

          Invoke-WebRequest -Uri "https://github.com/$($cfg.upstreamRepo)/releases/download/$env:VERSION/$assetName" -OutFile upstream.zip
          Expand-Archive -Path upstream.zip -DestinationPath dist
          $root = Join-Path dist $rootName
          if (-not (Test-Path (Join-Path $root $entry))) {
            throw "$entry not found in $root"
          }

          # winget portable requires an exe, so add a launcher for the entry script.
          (Get-Content launcher.cs -Raw).Replace('@ENTRY_SCRIPT@', $entry) | Set-Content -Path launcher.build.cs -Encoding utf8
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:"$root\$($cfg.launcher)" launcher.build.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile launcher." }

          Compress-Archive -Path $root -DestinationPath "$($cfg.packageName)-$env:VERSION-Windows-x64.zip"

      - name: Create release
        if: env.SKIP != 'true'
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          gh release create $env:VERSION "$($cfg.packageName)-$env:VERSION-Windows-x64.zip" `
            --repo ${{ github.repository }} `
            --title "$($cfg.packageName) $env:VERSION" `
            --notes "$($cfg.packageName) $env:VERSION package for winget (adds $($cfg.launcher) launcher for $($cfg.entryScript))."
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release." }
