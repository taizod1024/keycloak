name: Build winget (manual)

on:
  workflow_dispatch:
    inputs:
      use_latest_tag:
        description: "Use latest upstream tag"
        default: true
        type: boolean
      tag_name:
        description: "Upstream version"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  determine-version:
    runs-on: windows-latest
    outputs:
      version: ${{ env.VERSION }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve upstream version
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $useLatest = "${{ inputs.use_latest_tag }}" -eq "true"
          $version = "${{ inputs.tag_name }}".Trim()

          if ($useLatest) {
            $latest = Invoke-RestMethod -Headers @{ Authorization = "Bearer ${{ secrets.GITHUB_TOKEN }}"; "User-Agent" = "keycloak-winget-build" } -Uri "https://api.github.com/repos/$($cfg.upstreamRepo)/releases/latest"
            $version = $latest.tag_name
          }
          elseif ([string]::IsNullOrWhiteSpace($version)) {
            throw "tag_name is required when use_latest_tag is false."
          }

          Write-Output "Upstream version: $version"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

  build:
    needs: determine-version
    uses: ./.github/workflows/winget-core.yml
    with:
      version: ${{ needs.determine-version.outputs.version }}
      skip_publish: true
    secrets: inherit
