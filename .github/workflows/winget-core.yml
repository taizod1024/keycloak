name: Winget core
run-name: "Winget - core workflow"

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      skip_publish:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Set version
        id: version
        run: |
          $version = "${{ inputs.version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "version is required."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build package
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $assetName = $cfg.upstreamAsset.Replace('{version}', $env:VERSION)
          $rootName = $cfg.upstreamRoot.Replace('{version}', $env:VERSION)
          $entry = $cfg.entryScript.Replace('/', '\')
          $releaseUrl = "https://api.github.com/repos/$($cfg.upstreamRepo)/releases/tags/$env:VERSION"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            "User-Agent" = "keycloak-winget-build"
          }
          $asset = @($release.assets | Where-Object { $_.name -eq $assetName })
          if ($asset.Count -ne 1) {
            throw "Expected exactly one upstream asset named '$assetName'; found $($asset.Count)."
          }
          Invoke-WebRequest -Uri $asset[0].browser_download_url -OutFile upstream.zip
          Expand-Archive -Path upstream.zip -DestinationPath dist
          $root = Join-Path dist $rootName
          if (-not (Test-Path (Join-Path $root $entry))) {
            throw "$entry not found in $root"
          }

          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "MSI requires a numeric major.minor.patch version; got '$env:VERSION'."
          }

          dotnet tool install --global wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw "Failed to install WiX." }
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"

          # The MSI installs the contents of the versioned folder directly into a fixed directory.
          $packagePaths = @()
          foreach ($scope in @(@{ Name = "perMachine"; Suffix = "machine" }, @{ Name = "perUser"; Suffix = "user" })) {
            $packagePath = "$($cfg.packageName)-$env:VERSION-x64-$($scope.Suffix).msi"
            & $wix build keycloak.wxs -arch x64 `
              -d Scope=$($scope.Name) -d Version=$env:VERSION `
              -d PackageName=$($cfg.packageName) -d Manufacturer=$($cfg.publisher) `
              -d SourceDir="$((Resolve-Path $root).Path)" -o $packagePath
            if ($LASTEXITCODE -ne 0) { throw "Failed to build $packagePath." }
            $packagePaths += $packagePath
          }
          "PACKAGE_PATHS=$($packagePaths -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create or update release
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $title = "$($cfg.packageName) $env:VERSION"
          $notes = "$($cfg.packageName) $env:VERSION MSI packages for winget. Includes the upstream server distribution."
          $packagePaths = $env:PACKAGE_PATHS -split ';'

          $releaseExists = $false
          $releaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$env:VERSION"
          try {
            Invoke-RestMethod -Uri $releaseUrl -Headers @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              "User-Agent" = "keycloak-winget-build"
            } | Out-Null
            $releaseExists = $true
          }
          catch {
            $statusCode = $null
            try {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            catch {
            }
            if ($statusCode -ne 404) {
              throw
            }
          }

          if ($releaseExists) {
            gh release upload $env:VERSION @packagePaths --repo ${{ github.repository }} --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload the package asset to the existing release." }
            gh release edit $env:VERSION --repo ${{ github.repository }} --title "$title" --notes "$notes" --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to update the existing release." }
          }
          else {
            gh release create $env:VERSION @packagePaths `
              --repo ${{ github.repository }} `
              --title "$title" `
              --notes "$notes" `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release." }
          }

  publish:
    if: inputs.skip_publish != true
    needs: build
    runs-on: windows-latest
    env:
      WINGETCREATE_VERSION: 1.12.13.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve package URL
        id: release
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $version = "${{ needs.build.outputs.version }}"
          $releaseUrl = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$version"
          $release = Invoke-RestMethod -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "keycloak-winget-publish"
          } -Uri $releaseUrl
          foreach ($suffix in @("machine", "user")) {
            $assetName = "$($cfg.packageName)-$version-x64-$suffix.msi"
            $asset = @($release.assets | Where-Object { $_.name -eq $assetName })
            if ($asset.Count -ne 1) {
              throw "Expected exactly one package asset named '$assetName'; found $($asset.Count)."
            }
            "${suffix}_installer_url=$($asset[0].browser_download_url)" >> $env:GITHUB_OUTPUT
          }

      - name: Install wingetcreate
        run: |
          $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$env:WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest -Uri $wingetCreateUrl -OutFile wingetcreate.exe
          .\wingetcreate.exe info

      - name: Submit package to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN || secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          .\.github\scripts\submit-winget.ps1 `
            -WingetCreatePath ".\wingetcreate.exe" `
            -PackageId "taizod1024.keycloak" `
            -Version "${{ needs.build.outputs.version }}" `
            -MachineInstallerUrl "${{ steps.release.outputs.machine_installer_url }}" `
            -UserInstallerUrl "${{ steps.release.outputs.user_installer_url }}" `
            -Token $env:WINGET_TOKEN
