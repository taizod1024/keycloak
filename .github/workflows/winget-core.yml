name: Winget core (build + publish)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      skip_publish:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WINGETCREATE_VERSION: 1.12.8.0

    steps:
      - uses: actions/checkout@v5

      - name: Set version
        run: |
          "VERSION=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build package
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $assetName = $cfg.upstreamAsset.Replace('{version}', $env:VERSION)
          $rootName = $cfg.upstreamRoot.Replace('{version}', $env:VERSION)
          $entry = $cfg.entryScript.Replace('/', '\')

          Invoke-WebRequest -Uri "https://github.com/$($cfg.upstreamRepo)/releases/download/$env:VERSION/$assetName" -OutFile upstream.zip
          Expand-Archive -Path upstream.zip -DestinationPath dist
          $root = Join-Path dist $rootName
          if (-not (Test-Path (Join-Path $root $entry))) {
            throw "$entry not found in $root"
          }

          # winget portable requires an exe, so add a launcher for the entry script.
          (Get-Content launcher.cs -Raw).Replace('@ENTRY_SCRIPT@', $entry) | Set-Content -Path launcher.build.cs -Encoding utf8
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:"$root\$($cfg.launcher)" launcher.build.cs
          if ($LASTEXITCODE -ne 0) { throw "Failed to compile launcher." }

          Compress-Archive -Path $root -DestinationPath "$($cfg.packageName)-$env:VERSION-Windows-x64.zip"

      - name: Create release
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          gh release create $env:VERSION "$($cfg.packageName)-$env:VERSION-Windows-x64.zip" `
            --repo ${{ github.repository }} `
            --title "$($cfg.packageName) $env:VERSION" `
            --notes "$($cfg.packageName) $env:VERSION package for winget (adds $($cfg.launcher) launcher for $($cfg.entryScript))." `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to create release." }

  publish:
    if: inputs.skip_publish != true
    needs: build
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WINGETCREATE_VERSION: 1.12.8.0

    steps:
      - uses: actions/checkout@v5

      - name: Get latest release
        id: release
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "keycloak-winget-publish"
          }
          $releasesUrl = "https://api.github.com/repos/${{ github.repository }}/releases"
          $releases = Invoke-RestMethod -Headers $headers -Uri $releasesUrl

          if (-not $releases -or $releases.Count -eq 0) {
            throw "No releases found."
          }

          $latest = $releases | Select-Object -First 1
          $asset = $latest.assets | Where-Object { $_.name -like "*Windows-x64.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "Asset not found in latest release."
          }

          Write-Output "version=$($latest.tag_name)" >> $env:GITHUB_OUTPUT
          Write-Output "asset_url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          Write-Output "Found release asset: $($asset.browser_download_url)"

      - name: Install wingetcreate
        run: |
          # Try to use system winget first
          $wingetPath = $(Get-Command winget -ErrorAction SilentlyContinue).Source
          if ($wingetPath) {
            Write-Output "Using system winget: $wingetPath"
            exit 0
          }

          # Try downloading wingetcreate from latest release
          Write-Output "Attempting to download wingetcreate..."
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/winget-create/releases" `
              -Headers @{"User-Agent" = "PowerShell"}
            $latest = $releases | Where-Object { -not $_.prerelease } | Select-Object -First 1
            $asset = $latest.assets | Where-Object { $_.name -eq "wingetcreate.exe" } | Select-Object -First 1
            
            if ($asset) {
              $downloadUrl = $asset.browser_download_url
              Write-Output "Found wingetcreate: $downloadUrl"
              Invoke-WebRequest -Uri $downloadUrl -OutFile "wingetcreate.exe" -TimeoutSec 30
              Write-Output "$(Get-Location)" | Add-Content $env:GITHUB_PATH
            } else {
              throw "No wingetcreate.exe asset found in latest release"
            }
          } catch {
            Write-Output "Failed to download wingetcreate: $_"
            exit 1
          }

      - name: Publish to winget
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $assetUrl = "${{ steps.release.outputs.asset_url }}"
          $version = "${{ steps.release.outputs.version }}"

          # Use wingetcreate if it exists, otherwise try winget
          $wingetcreate = "wingetcreate.exe"
          if (-not (Get-Command $wingetcreate -ErrorAction SilentlyContinue)) {
            $wingetcreate = "winget"
          }

          Write-Output "Using: $wingetcreate"
          Write-Output "Publishing $($cfg.packageId) version $version"
          Write-Output "Asset URL: $assetUrl"

          & $wingetcreate update --token $env:GH_TOKEN `
            --urls $assetUrl `
            --version $version `
            $cfg.packageId

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish to winget (exit code: $LASTEXITCODE)"
          }
