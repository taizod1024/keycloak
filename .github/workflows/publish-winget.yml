name: Publish winget (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: windows-latest
    env:
      WINGETCREATE_VERSION: 1.12.13.0
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Get latest release
        id: release
        run: |
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            "User-Agent" = "keycloak-winget-publish"
          }
          $releasesUrl = "https://api.github.com/repos/${{ github.repository }}/releases"
          $releases = Invoke-RestMethod -Headers $headers -Uri $releasesUrl

          if (-not $releases -or $releases.Count -eq 0) {
            throw "No releases found."
          }

          $latest = $releases | Select-Object -First 1
          $asset = $latest.assets | Where-Object { $_.name -like "*Windows-x64.zip" } | Select-Object -First 1
          if (-not $asset) {
            throw "Asset not found in latest release."
          }

          Write-Output "version=$($latest.tag_name)" >> $env:GITHUB_OUTPUT
          Write-Output "asset_url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT
          Write-Output "Found release asset: $($asset.browser_download_url)"

      - name: Install wingetcreate
        run: |
          $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$env:WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest -Uri $wingetCreateUrl -OutFile wingetcreate.exe
          .\wingetcreate.exe info

      - name: Publish to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN || secrets.GH_PAT }}
        run: |
          function Normalize-Token([string]$value) {
            if ([string]::IsNullOrWhiteSpace($value)) {
              return ""
            }
            # Remove accidental line breaks/spaces that break Authorization headers.
            return ($value -replace "`r|`n", "").Trim()
          }

          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $version = "${{ steps.release.outputs.version }}"
          $url = "${{ steps.release.outputs.asset_url }}"
          $id = $cfg.packageId
          $publisher = $cfg.publisher
          $shortDescription = $cfg.shortDescription
          $license = $cfg.license
          $licenseUrl = $cfg.licenseUrl

          $token = Normalize-Token $env:WINGET_TOKEN

          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "No GitHub token is available for winget submission."
          }

          if ($token -notmatch '^[A-Za-z0-9_]+$') {
            throw "GitHub token contains invalid characters."
          }

          Write-Output "Submitting to winget: $id $version"
          Write-Output "Installer URL: $url"

          # Fast path: package already exists in winget-pkgs.
          .\wingetcreate.exe update --urls $url --version $version $id --submit --token $token

          if ($LASTEXITCODE -eq 0) {
            Write-Output "Updated existing package successfully."
            exit 0
          }

          # Fallback path: first-time package registration.
          Write-Output "Package update failed. Trying first-time package registration flow..."

          # Create manifest directory
          $manifestDir = Join-Path $pwd "winget-manifests"
          if (Test-Path $manifestDir) {
            Remove-Item -Path $manifestDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $manifestDir | Out-Null

          # Create version subdirectory (e.g., manifests/p/publisher/package/1.0.0)
          $versionDir = Join-Path $manifestDir "manifests" "t" "$publisher" "$($cfg.packageName)" "$version"
          New-Item -ItemType Directory -Path $versionDir -Force | Out-Null

          # Create installer manifest
          $installerManifest = @"
PackageIdentifier: $id
PackageVersion: $version
PackageLocale: en-US
Installers:
  - Architecture: x64
    InstallerUrl: $url
    InstallerType: zip
ManifestType: installer
ManifestVersion: 1.0.0
"@
          $installerManifest | Out-File -FilePath (Join-Path $versionDir "$($cfg.packageName).installer.yaml") -Encoding utf8

          # Create default manifest
          $defaultManifest = @"
PackageIdentifier: $id
PackageVersion: $version
DefaultLocale: en-US
ManifestType: version
ManifestVersion: 1.0.0
"@
          $defaultManifest | Out-File -FilePath (Join-Path $versionDir "$($cfg.packageName).yaml") -Encoding utf8

          # Create locale manifest
          $localeManifest = @"
PackageIdentifier: $id
PackageVersion: $version
PackageLocale: en-US
Publisher: '$publisher'
PublisherUrl: https://github.com/$publisher
PublisherSupportUrl: https://github.com/${{ github.repository }}/issues
PackageName: $($cfg.packageName)
PackageUrl: https://github.com/${{ github.repository }}
License: $license
LicenseUrl: $licenseUrl
ShortDescription: '$shortDescription'
ManifestType: defaultLocale
ManifestVersion: 1.0.0
"@
          $localeManifest | Out-File -FilePath (Join-Path $versionDir "$($cfg.packageName).locale.en-US.yaml") -Encoding utf8

          Write-Output "Created manifest files in $manifestDir"
          
          # Submit new package
          .\wingetcreate.exe submit (Join-Path $manifestDir "manifests") --token $token
