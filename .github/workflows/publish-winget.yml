name: Publish winget (manual)
run-name: "Publish winget - manual trigger"

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: windows-latest
    env:
      WINGETCREATE_VERSION: 1.12.13.0

    steps:
      - uses: actions/checkout@v5

      - name: Resolve latest package version
        id: release
        run: |
          $releasesUrl = "https://api.github.com/repos/${{ github.repository }}/releases"
          $releases = Invoke-RestMethod -Uri $releasesUrl -Headers @{
            "User-Agent" = "keycloak-winget-publish"
          }
          if (-not $releases -or $releases.Count -eq 0) {
            throw "No releases found."
          }
          $latest = $releases | Select-Object -First 1
          $cfg = Get-Content winget.config.json -Raw | ConvertFrom-Json
          $version = $latest.tag_name
          $assetName = "$($cfg.packageName)-$version-Windows-x64.zip"
          $asset = @($latest.assets | Where-Object { $_.name -eq $assetName })
          if ($asset.Count -ne 1) {
            throw "Expected exactly one package asset named '$assetName'; found $($asset.Count)."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "installer_url=$($asset[0].browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        run: |
          $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$env:WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest -Uri $wingetCreateUrl -OutFile wingetcreate.exe
          .\wingetcreate.exe info

      - name: Submit upstream installer to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN || secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          .\.github\scripts\submit-winget.ps1 `
            -WingetCreatePath ".\wingetcreate.exe" `
            -PackageId "taizod1024.keycloak" `
            -Version "${{ steps.release.outputs.version }}" `
            -InstallerUrl "${{ steps.release.outputs.installer_url }}" `
            -Token $env:WINGET_TOKEN
